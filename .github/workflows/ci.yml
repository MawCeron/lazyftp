name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # The race detector needs cgo, which is not available on every runner.
      - run: go test -race ./...
        if: matrix.os == 'ubuntu-latest'
